# Public pages used as the knowledge base. Every URL below was taken from the official
# ontario.ca / canada.ca index pages on 2026-09-19 (several were also opened directly).
# A second batch (food handler certification, employment standards, start-up costs) was
# added on 2026-09-23 to cover process/checklist questions the first batch left thin.
# fetch_sources.py reports any that fail, so pages that move are easy to spot.
# Add your own URLs the same way, then run:
#
#     python fetch_sources.py
#
# license values:
#   ogl_ontario      Open Government Licence - Ontario. Commercial use allowed with
#                    attribution ("Contains information licensed under the Open
#                    Government Licence - Ontario").
#   crown_noncommercial
#                    Government of Canada (canada.ca) terms: reproduction without
#                    permission is for NON-COMMERCIAL use only, with title, author and
#                    source URL cited. Fine for a private prototype. Get written
#                    permission before using this content in a commercial product.

